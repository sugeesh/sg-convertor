[project]
name = "sg-convertor"
version = "0.1.0"
description = "Desktop app that converts MP4 videos to MP3 or M4A audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
sg-convertor = "sg_convertor.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
